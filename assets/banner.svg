    <rect x="1" y="1" width="472" height="322" rx="23" fill="none" stroke="url(#accent)" stroke-opacity="0.18"/>

    <g transform="translate(28 24)">
      <path d="M5 0h24l12 12v42H5z" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-width="1.5"/>
