        <rect width="196" height="52" rx="12" fill="#ffffff" fill-opacity="0.045"/>
        <circle cx="22" cy="26" r="5" fill="#a78bfa"/>
        <text x="38" y="31" fill="#dfe4f5" font-weight="600">instructions</text>
      </g>
      <g transform="translate(216)">
        <rect width="200" height="52" rx="12" fill="#ffffff" fill-opacity="0.045"/>
        <circle cx="22" cy="26" r="5" fill="#818cf8"/>
        <text x="38" y="31" fill="#dfe4f5" font-weight="600">scripts/</text>
      </g>
      <g transform="translate(0 68)">
        <rect width="196" height="52" rx="12" fill="#ffffff" fill-opacity="0.045"/>
        <circle cx="22" cy="26" r="5" fill="#5eead4"/>
        <text x="38" y="31" fill="#dfe4f5" font-weight="600">references/</text>
      </g>
      <g transform="translate(216 68)">
        <rect width="200" height="52" rx="12" fill="#ffffff" fill-opacity="0.045"/>
        <circle cx="22" cy="26" r="5" fill="#22d3ee"/>
        <text x="38" y="31" fill="#dfe4f5" font-weight="600">assets/</text>
      </g>
    </g>

    <g transform="translate(29 266)">
      <path d="M0 14H308" stroke="url(#accent)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="14" r="4" fill="#a78bfa"/>
      <circle cx="154" cy="14" r="4" fill="#818cf8"/>
      <circle cx="308" cy="14" r="4" fill="#22d3ee"/>
      <rect x="324" width="92" height="28" rx="14" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.45"/>
      <text x="347" y="19" fill="#bff8ff" font-size="11" font-weight="750" letter-spacing="1.4">REUSABLE</text>
