<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="280" viewBox="0 0 1440 280" role="img" aria-labelledby="title desc">
  <title id="title">One skill format for Claude, Codex, and Antigravity</title>
  <desc id="desc">Reusable agent skills with focused instructions, resources, and tested tooling</desc>
  <defs>
    <linearGradient id="background" x1="30" y1="0" x2="1410" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080b16"/>
      <stop offset="0.52" stop-color="#11152b"/>
      <stop offset="1" stop-color="#071b24"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect width="1440" height="280" rx="24" fill="url(#background)"/>
  <rect width="1440" height="280" rx="24" fill="url(#grid)"/>
  <circle cx="110" cy="280" r="150" fill="#7c3aed" opacity="0.14" filter="url(#glow)"/>
  <circle cx="1330" cy="10" r="150" fill="#22d3ee" opacity="0.11" filter="url(#glow)"/>
  <rect x="1" y="1" width="1438" height="278" rx="23" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="720" y="52" fill="#aab4d0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.2" text-anchor="middle">PORTABLE AGENT SKILLS</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle">
    <text x="720" y="135" fill="#ffffff" font-size="58" font-weight="750" letter-spacing="-2.2">One skill format. Use it across agents.</text>
    <text x="720" y="179" fill="#aeb8d2" font-size="21" font-weight="450">Focused instructions, reusable resources, and tested tooling.</text>
  </g>

  <g transform="translate(0 218)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600">
    <image x="508" y="0" width="22" height="22" href="data:image/svg+xml;base64,"/>
    <text x="540" y="17" fill="#e5e8f3">Claude Code</text>

    <image x="679" y="0" width="22" height="22" href="data:image/svg+xml;base64,"/>
    <text x="711" y="17" fill="#e5e8f3">Codex</text>

    <image x="811" y="0" width="22" height="22" href="data:image/png;base64,"/>
    <text x="843" y="17" fill="#e5e8f3">Antigravity</text>
  </g>
</svg>
