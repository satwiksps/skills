    <path d="M22 24h34M22 39h22M22 54h30" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <text x="0" y="172" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="104" font-weight="750" letter-spacing="-4">skills</text>
    <text x="4" y="222" fill="#b8c0d9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="500" letter-spacing="1.5">TESTED WORKFLOWS FOR CODEX</text>
  </g>
