      <path d="M14 25h18M14 34h14M14 43h17" stroke="#d8d8ff" stroke-width="2.5" stroke-linecap="round"/>
      <text x="58" y="25" fill="#ffffff" font-size="24" font-weight="700">SKILL.md</text>
      <text x="58" y="47" fill="#8794b3" font-size="13" letter-spacing="1">THE PORTABLE ENTRY POINT</text>
