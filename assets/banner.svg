<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="420" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">One skill format for Claude, Codex, and Antigravity</title>
  <desc id="desc">Reusable agent skills with focused instructions, scripts, references, and assets</desc>
  <defs>
    <linearGradient id="background" x1="40" y1="10" x2="1400" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080b16"/>
      <stop offset="0.56" stop-color="#11152b"/>
      <stop offset="1" stop-color="#071b24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171b35"/>
      <stop offset="1" stop-color="#0d2230"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
  </defs>

  <rect width="1440" height="420" rx="28" fill="url(#background)"/>
  <rect width="1440" height="420" rx="28" fill="url(#grid)"/>
  <circle cx="180" cy="410" r="150" fill="#7c3aed" opacity="0.13" filter="url(#glow)"/>
  <circle cx="1270" cy="20" r="150" fill="#22d3ee" opacity="0.10" filter="url(#glow)"/>
  <rect x="1" y="1" width="1438" height="418" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(82 62)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <g>
      <rect width="38" height="38" rx="10" fill="url(#accent)"/>
      <path d="M11 12h16M11 19h11M11 26h14" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/>
      <text x="54" y="25" fill="#aab4d0" font-size="15" font-weight="700" letter-spacing="2.2">PORTABLE AGENT SKILLS</text>
    </g>

    <text x="0" y="109" fill="#ffffff" font-size="58" font-weight="750" letter-spacing="-2.4">One skill format.</text>
    <text x="0" y="174" fill="#ffffff" font-size="58" font-weight="750" letter-spacing="-2.4">Use it across agents.</text>
    <text x="2" y="220" fill="#aeb8d2" font-size="21" font-weight="450">Focused instructions, reusable resources, and tested tooling.</text>

    <g transform="translate(0 267)" font-size="13" font-weight="700" letter-spacing="1">
      <rect width="142" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#a78bfa" stroke-opacity="0.65"/>
      <circle cx="21" cy="21" r="5" fill="#a78bfa"/>
      <text x="36" y="26" fill="#e9e7ff">CLAUDE CODE</text>

      <rect x="154" width="108" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#818cf8" stroke-opacity="0.65"/>
      <circle cx="175" cy="21" r="5" fill="#818cf8"/>
      <text x="190" y="26" fill="#e9e7ff">CODEX</text>

      <rect x="274" width="166" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#22d3ee" stroke-opacity="0.65"/>
      <circle cx="295" cy="21" r="5" fill="#22d3ee"/>
      <text x="310" y="26" fill="#dcfbff">ANTIGRAVITY</text>
