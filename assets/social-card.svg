      <circle cx="0" cy="15" r="4" fill="#a78bfa"/>
      <circle cx="103" cy="15" r="4" fill="#818cf8"/>
      <circle cx="206" cy="15" r="4" fill="#22d3ee"/>
      <rect x="224" width="98" height="30" rx="15" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="247" y="20" fill="#c6f9ff" font-size="11" font-weight="750" letter-spacing="1.3">REUSABLE</text>
