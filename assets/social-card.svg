      <path d="M5 0h28l13 13v48H5z" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-width="1.6"/>
      <path d="M33 0v13h13" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
      <path d="M15 29h20M15 39h15M15 49h19" stroke="#dedcff" stroke-width="2.8" stroke-linecap="round"/>
      <text x="64" y="28" fill="#ffffff" font-size="27" font-weight="720">SKILL.md</text>
      <text x="64" y="52" fill="#8d99b7" font-size="12" letter-spacing="1.4">PORTABLE ENTRY POINT</text>
    </g>

    <path d="M30 116H352" stroke="#ffffff" stroke-opacity="0.10"/>

