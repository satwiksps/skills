    <text x="0" y="77" fill="#ffffff" font-size="66" font-weight="760" letter-spacing="-2.7">Use it across agents.</text>
    <text x="2" y="133" fill="#aeb8d2" font-size="23">Reusable workflows with instructions, resources, and tests.</text>

    <g transform="translate(0 178)" font-size="13" font-weight="750" letter-spacing="1">
      <rect width="140" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#a78bfa" stroke-opacity="0.7"/>
      <circle cx="20" cy="21" r="5" fill="#a78bfa"/>
      <text x="35" y="26" fill="#eceaff">CLAUDE CODE</text>

      <rect x="152" width="104" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#818cf8" stroke-opacity="0.7"/>
      <circle cx="172" cy="21" r="5" fill="#818cf8"/>
      <text x="187" y="26" fill="#eceaff">CODEX</text>

      <rect x="268" width="164" height="42" rx="21" fill="#ffffff" fill-opacity="0.055" stroke="#22d3ee" stroke-opacity="0.7"/>
      <circle cx="288" cy="21" r="5" fill="#22d3ee"/>
      <text x="303" y="26" fill="#dcfbff">ANTIGRAVITY</text>
    </g>
