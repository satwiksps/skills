<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Satwik's Skills</title>
  <desc id="desc">One skill format for Claude, Codex, and Antigravity</desc>
  <defs>
    <linearGradient id="background" x1="20" y1="20" x2="1260" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#080b16"/>
      <stop offset="0.58" stop-color="#11152b"/>
      <stop offset="1" stop-color="#071c25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.52" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191d39"/>
      <stop offset="1" stop-color="#0c2530"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="80" cy="620" r="180" fill="#7c3aed" opacity="0.14" filter="url(#glow)"/>
  <circle cx="1220" cy="10" r="170" fill="#22d3ee" opacity="0.11" filter="url(#glow)"/>
  <rect x="1" y="1" width="1278" height="638" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(76 66)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect width="42" height="42" rx="11" fill="url(#accent)"/>
    <path d="M12 13h18M12 21h12M12 29h16" fill="none" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round"/>
    <text x="58" y="27" fill="#c4cbe0" font-size="17" font-weight="750" letter-spacing="2.2">SATWIKSPS / SKILLS</text>
  </g>

  <g transform="translate(76 172)" font-family="Inter, Segoe UI, Arial, sans-serif">
