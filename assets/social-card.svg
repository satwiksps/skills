      <circle cx="23" cy="26" r="5" fill="#a78bfa"/>
      <text x="41" y="32" fill="#e2e7f7">focused instructions</text>

      <rect y="68" width="322" height="52" rx="13" fill="#ffffff" fill-opacity="0.045"/>
      <circle cx="23" cy="94" r="5" fill="#818cf8"/>
      <text x="41" y="100" fill="#e2e7f7">reusable resources</text>

      <rect y="136" width="322" height="52" rx="13" fill="#ffffff" fill-opacity="0.045"/>
      <circle cx="23" cy="162" r="5" fill="#22d3ee"/>
      <text x="41" y="168" fill="#e2e7f7">tested tooling</text>
    </g>

    <g transform="translate(30 362)">
